# Builds the Android app.
# Every push to main publishes the "android-latest" release with:
# - theory-trainer.apk: installable straight onto a phone;
# - theory-trainer-<version>-<versionCode>.aab: the Play Store bundle, ready to upload
#   in Play Console (only when the UPLOAD_KEY_PASSWORD secret is set).
# Version tags (v1.0.0, …) additionally get a release of their own.
# Builds are signed with the Play upload key when UPLOAD_KEY_PASSWORD is set
# (the key itself is stored encrypted in store/upload-keystore.jks.enc).
name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Set version and signing
        run: |
          if [ -n "$UPLOAD_KEY_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
              -in store/upload-keystore.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:UPLOAD_KEY_PASSWORD
            node scripts/android-release-signing.mjs "${{ github.run_number }}" "$RUNNER_TEMP/upload.jks"
          else
            [ "$IS_TAG" = "true" ] && { echo "::error::Set the UPLOAD_KEY_PASSWORD secret before tagging a Play release"; exit 1; }
            node scripts/android-release-signing.mjs "${{ github.run_number }}"
          fi
      - name: Build the APK
        working-directory: android
        # Modern phones are 64-bit ARM; building only that keeps the APK small and the build fast.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        env:
          NODE_ENV: production
      - name: Build the Play Store bundle
        if: env.UPLOAD_KEY_PASSWORD != ''
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
        env:
          NODE_ENV: production
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk theory-trainer.apk
          files="theory-trainer.apk"
          if [ -n "$UPLOAD_KEY_PASSWORD" ]; then
            version=$(node -p "require('./app.json').expo.version")
            aab="theory-trainer-${version}-${{ github.run_number }}.aab"
            cp android/app/build/outputs/bundle/release/app-release.aab "$aab"
            files="$files $aab"
          fi
          if [ "$IS_TAG" = "true" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "theory-trainer-${GITHUB_REF_NAME}.aab"
            gh release create "$GITHUB_REF_NAME" "theory-trainer-${GITHUB_REF_NAME}.aab" theory-trainer.apk \
              --title "Theory Trainer ${GITHUB_REF_NAME} (version code ${{ github.run_number }})" \
              --notes "Upload the .aab file in Play Console (Testing → Closed testing → Create new release)." \
              --latest=false
          else
            gh release delete android-latest --yes --cleanup-tag || true
            gh release create android-latest $files \
              --title "Theory Trainer for Android (build ${{ github.run_number }})" \
              --notes "Built from ${{ github.sha }}. Phone: download theory-trainer.apk and install it. Play Store: upload the .aab file in Play Console." \
              --latest
          fi
